<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>远程拼音命名音频播报器</title>
<style>
*{box-sizing:border-box;font-family:system-ui,sans-serif}
body{padding:16px;max-width:900px;margin:0 auto;background:#f5f7fa}
.card{background:#fff;border-radius:12px;padding:16px;margin-bottom:12px;box-shadow:0 2px 8px #00000012}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
input{padding:8px 10px;border:1px solid #ccc;border-radius:6px;font-size:16px}
button{padding:8px 14px;border:none;border-radius:6px;background:#2563eb;color:#fff;cursor:pointer;font-size:15px}
button:disabled{background:#94a3b8;cursor:not-allowed}
.word-item{padding:6px 10px;border:1px solid #ddd;border-radius:6px;cursor:pointer;margin:4px;background:#fafafa}
.word-item:hover{background:#eef6ff}
.word-item.playing{background:#2563eb;color:#fff}
.log{height:220px;overflow:auto;background:#111;color:#39ff14;padding:10px;border-radius:8px;font-family:monospace;font-size:13px;white-space:pre-wrap}
.info{color:#666;margin:8px 0}
.token-box{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.token{padding:4px 8px;background:#e6f0ff;border-radius:4px}
</style>
</head>
<body>
<div class="card">
  <h3>📡 远程TTS音频源（拼音/数字命名）</h3>
  <div class="info">基础地址：https://onem.de5.net/tts/</div>
  <div id="loadTip">等待初始化远程音频……</div>
</div>

<div class="card">
  <h3>💰 金额播报</h3>
  <div class="row">
    <input id="moneyInput" value="10.05" placeholder="输入金额，如10.05">
    <button id="playBtn">开始播报</button>
    <button id="stopBtn">停止</button>
  </div>
  <div class="info">读法预览：<span id="readText"></span></div>
  <div class="token-box" id="tokenView"></div>
</div>

<div class="card">
  <h3>🎧 词条单点试听（点击播放）</h3>
  <div id="wordList"></div>
</div>

<div class="card">
  <h3>📜 日志</h3>
  <div class="log" id="logBox"></div>
</div>

<script>
// 【核心映射：中文词条 → 文件名】
const WORD_MAP = {
  "零": "0",
  "一": "1",
  "二": "2",
  "三": "3",
  "四": "4",
  "五": "5",
  "六": "6",
  "七": "7",
  "八": "8",
  "九": "9",
  "十": "10",
  "百": "bai",
  "千": "qian",
  "万": "wan",
  "订单": "dingdan",
  "点": "dian",
  "元": "yuan",
  "合计": "heji",
  "请取餐": "qingqucan",
  "谢谢": "xiexie"
};
const WORD_LIST = Object.keys(WORD_MAP);
const BASE_URL = "https://onem.de5.net/tts/";
const GAP = 0.15; // 间隔150ms

let audioMap = {};
let playingQueue = [];
let isPlaying = false;
let currentAudio = null;

const logBox = document.getElementById('logBox');
const playBtn = document.getElementById('playBtn');
const stopBtn = document.getElementById('stopBtn');
const moneyInput = document.getElementById('moneyInput');
const readText = document.getElementById('readText');
const tokenView = document.getElementById('tokenView');
const wordListEl = document.getElementById('wordList');
const loadTip = document.getElementById('loadTip');

function log(msg){
  const t = new Date().toLocaleTimeString();
  logBox.innerText += `[${t}] ${msg}\n`;
  logBox.scrollTop = logBox.scrollHeight;
}

function renderWordList(){
  wordListEl.innerHTML = '';
  WORD_LIST.forEach(w=>{
    const span = document.createElement('span');
    span.className = 'word-item';
    span.innerText = w;
    span.onclick = ()=>playSingleWord(w);
    wordListEl.appendChild(span);
  })
}

function initRemoteAudios(){
  let okCount = 0;
  for(const word of WORD_LIST){
    const filename = WORD_MAP[word];
    const url = `${BASE_URL}${filename}.mp3`;
    const audio = new Audio();
    audio.crossOrigin = "anonymous";
    audio.src = url;
    audio.preload = "metadata";
    audio.onerror = function() {
      log(`❌【${word}】加载失败，地址：${url}`);
    }
    audioMap[word] = audio;
    okCount++;
  }
  loadTip.innerText = `✅ 已初始化${okCount}个远程音频`;
  log(`📡 音频初始化完成`);
}

async function playSingleWord(word){
  if(!audioMap[word]){
    log(`❌ 找不到词条【${word}】音频实例`);
    return;
  }
  stopAll();
  const audio = audioMap[word];
  audio.currentTime = 0;
  try{
    await audio.play();
    log(`▶ 播放【${word}】`);
  }catch(e){
    log(`❌ 播放【${word}】失败：${e.message}`);
  }
}

function stopAll(){
  playingQueue = [];
  isPlaying = false;
  if(currentAudio){
    currentAudio.pause();
    currentAudio.currentTime = 0;
  }
  document.querySelectorAll('.word-item.playing').forEach(el=>el.classList.remove('playing'));
}

async function playQueue(tokens){
  stopAll();
  playingQueue = [...tokens];
  isPlaying = true;
  log(`✅ 开始播报队列: ${tokens.join('｜')}`);
  for(let i=0;i<playingQueue.length;i++){
    if(!isPlaying) break;
    const w = playingQueue[i];
    const audio = audioMap[w];
    if(!audio){
      log(`⚠ 跳过缺失音频【${w}】`);
      continue;
    }
    document.querySelectorAll('.word-item.playing').forEach(el=>el.classList.remove('playing'));
    const btn = [...document.querySelectorAll('.word-item')].find(x=>x.innerText===w);
    if(btn) btn.classList.add('playing');
    audio.currentTime = 0;
    currentAudio = audio;
    try{
      await audio.play();
      await new Promise(resolve=>{
        audio.onended = ()=>resolve();
      })
    }catch(e){
      log(`❌【${w}】播放异常:${e.message}`);
    }
    await sleep(GAP*1000);
  }
  isPlaying = false;
  log('✅ 播报结束');
}

function sleep(ms){
  return new Promise(r=>setTimeout(r,ms));
}

function numToZh(c){
  const map = {'0':'零','1':'一','2':'二','3':'三','4':'四','5':'五','6':'六','7':'七','8':'八','9':'九'}
  return map[c];
}

function parseIntPart(s){
  const digits = s.split('');
  const res = [];
  const unit = ['','十','百','千','万'];
  for(let i=0;i<digits.length;i++){
    const d = digits[i];
    const pos = digits.length - 1 - i;
    if(d === '0'){
      res.push('零');
    }else{
      res.push(numToZh(d));
      if(unit[pos]) res.push(unit[pos]);
    }
  }
  return res;
}

// 金额转token，规则：10.05 → ["十","点","零","五","元"]
function moneyToToken(money){
  const num = Number(money);
  if(isNaN(num)) return [];
  const s = num.toFixed(2);
  const [intStr, decStr] = s.split('.');
  const tokens = [];
  if(intStr === '0'){
    tokens.push('零');
  }else{
    tokens.push(...parseIntPart(intStr));
  }
  if(decStr !== '00'){
    tokens.push('点');
    if(decStr[0]!=='0'){
      tokens.push(numToZh(decStr[0]))
    }else{
      tokens.push('零')
    }
    if(decStr[1]!=='0'){
      tokens.push(numToZh(decStr[1]))
    }
  }
  tokens.push('元');
  return tokens;
}

moneyInput.oninput = ()=>{
  const tokens = moneyToToken(moneyInput.value);
  readText.innerText = tokens.join('｜');
  tokenView.innerHTML = tokens.map(t=>`<span class="token">${t}</span>`).join('');
}

playBtn.onclick = ()=>{
  const tokens = moneyToToken(moneyInput.value);
  if(tokens.length===0) return log('❌ 金额无效');
  playQueue(tokens);
}
stopBtn.onclick = stopAll;

renderWordList();
initRemoteAudios();
moneyInput.dispatchEvent(new Event('input'));
</script>
</body>
</html>
